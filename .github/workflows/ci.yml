name: 3Tier DevSecOps Pipeline

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

env:
  NODE_VERSION: '23'

jobs:
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for better GitLeaks scanning
    
    - name: Run GitLeaks Scan
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: security-scan  # Run only if security scan passes
    
    strategy:
      matrix:
        component: [frontend, backend]
        
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        ref: dev
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install Dependencies - Frontend
      if: matrix.component == 'frontend'
      working-directory: ./client
      run: |
        if [ -f package.json ]; then
          npm install
        fi
    
    - name: Install Dependencies - Backend
      if: matrix.component == 'backend'
      working-directory: ./api
      run: |
        if [ -f package.json ]; then
          npm install
        fi
    
    - name: Frontend Compilation Check
      if: matrix.component == 'frontend'
      working-directory: ./client
      run: |
        echo "Running frontend compilation check..."
        find . -name "*.js" -exec node --check {} + || exit 1
        echo "Frontend compilation check passed!"
    
    - name: Backend Compilation Check
      if: matrix.component == 'backend'
      working-directory: ./api
      run: |
        echo "Running backend compilation check..."
        find . -name "*.js" -exec node --check {} + || exit 1
        echo "Backend compilation check passed!"
    
    - name: Run Tests - Frontend
      if: matrix.component == 'frontend'
      working-directory: ./client
      run: |
        if [ -f package.json ] && npm run test --dry-run 2>/dev/null; then
          npm test
        else
          echo "No tests found for frontend"
        fi
    
    - name: Run Tests - Backend
      if: matrix.component == 'backend'
      working-directory: ./api
      run: |
        if [ -f package.json ] && npm run test --dry-run 2>/dev/null; then
          npm test
        else
          echo "No tests found for backend"
        fi

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Integration Test Placeholder
      run: echo "Integration tests would run here"
    
    - name: Success Message
      run: echo "🎉 All checks passed! Hello World from GitHub Actions!"

  # Optional: Deploy stage (only runs on main branch)
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: integration
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Deploy Placeholder
      run: echo "🚀 Deploy stage - would deploy to production here"