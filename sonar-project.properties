# SonarQube Configuration
sonar.projectKey=3tier-devsecops-project
sonar.projectName=3Tier DevSecOps Project
sonar.projectVersion=1.0

# Source directories
sonar.sources=client,api
sonar.sourceEncoding=UTF-8

# Test and coverage paths
sonar.javascript.lcov.reportPaths=client/coverage/lcov.info,api/coverage/lcov.info
sonar.testExecutionReportPaths=client/test-results.xml,api/test-results.xml

# Exclusions
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/build/**,**/*.test.js,**/*.spec.js,**/*.config.js

# Quality gate conditions
sonar.qualitygate.wait=true

# Language-specific settings
sonar.javascript.environments=node,browser
sonar.typescript.node=node_modules/typescript/lib

# Duplication threshold
sonar.cpd.exclusions=**/*.test.js,**/*.spec.js